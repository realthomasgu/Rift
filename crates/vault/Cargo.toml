[package]
name = "vault"
description = "Vault: Timeline snapshots, encrypted backups, and drive cloning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "vault"
path = "src/main.rs"

# runs in the initrd, makes persist on a drive that has none yet
[[bin]]
name = "vault-first-boot"
path = "src/first_boot.rs"

[dependencies]
# the drive layout, the guard and the steps a clone writes with, shared with rift-flash. bus is
# for asking Orbit what machine this is, which decides whether a key may be sealed to its tpm
librift = { workspace = true, features = ["bus", "disk"] }
# the system bus interface. blocking takes a snapshot or a restore off the bus's own threads
zbus = { version = "5.18", default-features = false, features = ["async-io", "blocking-api"] }
blocking = "1.6"
# an flock on the snapshot directory, how full persist is, and whether a clone runs as root,
# without unsafe code
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std", "termios"] }
# the backup target, and what rustic and findmnt print with --json
serde.workspace = true
serde_json.workspace = true
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }
# the owner's password: yescrypt for a new one, the hash NixOS's own tools make, and sha-crypt to
# check the one every drive starts with, which NixOS hashes that way
yescrypt = "0.1"
sha-crypt = "0.6"

[lints]
workspace = true
