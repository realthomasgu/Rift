name: store probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: Appstream data a repository of our own can carry
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: The image's own flatpak
        run: |
          nix build --inputs-from . nixpkgs#flatpak -o fp -L
          ./fp/bin/flatpak --version
      - name: An app with an app-info file of its own
        run: |
          set -x
          export PATH=$PWD/fp/bin:$PATH
          export HOME=$RUNNER_TEMP/home
          mkdir -p "$HOME"
          mkdir -p probe/files/bin probe/files/share/app-info/xmls probe/export/share/applications
          printf '#!/bin/sh\necho hello\n' > probe/files/bin/probe
          chmod 755 probe/files/bin/probe
          cat > probe/metadata <<'EOF'
          [Application]
          name=dev.rift.TestEditor
          runtime=dev.rift.TestPlatform/x86_64/test
          sdk=dev.rift.TestPlatform/x86_64/test
          command=probe

          [Context]
          shared=network;ipc;
          sockets=wayland;pulseaudio;
          devices=dri;
          filesystems=home;xdg-download:ro;

          [Session Bus Policy]
          org.freedesktop.Notifications=talk
          EOF
          cat > components.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <components version="0.8">
            <component type="desktop-application">
              <id>dev.rift.TestEditor.desktop</id>
              <name>Rift test editor</name>
              <summary>A plain text editor for the boot test</summary>
              <description><p>The app the boot test installs from the store. It has a name and a summary of its own, so the store has something to search.</p></description>
              <project_license>MIT</project_license>
              <metadata_license>CC0-1.0</metadata_license>
              <categories><category>Utility</category><category>TextEditor</category></categories>
            </component>
          </components>
          EOF
          gzip -n -c components.xml > probe/files/share/app-info/xmls/dev.rift.TestEditor.xml.gz
          cat > probe/export/share/applications/dev.rift.TestEditor.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Rift test editor
          Exec=probe
          Categories=Utility;
          EOF
          flatpak build-export --disable-fsync probe-repo probe test
          flatpak build-update-repo probe-repo
          find probe-repo/refs -type f
          export FLATPAK_USER_DIR=$RUNNER_TEMP/fuser
          mkdir -p "$FLATPAK_USER_DIR"
          flatpak remote-add --user --no-gpg-verify probe "file://$PWD/probe-repo"
          echo "== remote-ls, which is where the store reads its catalogue"
          flatpak remote-ls --user --app --columns=application,name,description,installed-size probe || true
          echo "== search, before and after a pull"
          flatpak search editor || true
          flatpak update --user --appstream -y || true
          flatpak search editor || true
          flatpak remote-ls --user --app --columns=application,name,description,installed-size probe || true
          echo "== the appstream the repository carries"
          zcat probe/files/share/app-info/xmls/dev.rift.TestEditor.xml.gz | head -n 4
          mkdir -p pulled
          flatpak remote-info --user --show-metadata probe dev.rift.TestEditor || true
          echo "== and what a second app with no appstream looks like beside it"
          flatpak remote-ls --user --columns=application,name,description,installed-size probe || true
