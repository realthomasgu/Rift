name: welcome probe
on:
  workflow_dispatch:

jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: What the chunkers cost
        run: |
          set +e
          df -h /
          for p in casync desync zsync; do
            echo "--- $p ---"
            nix build --inputs-from . "nixpkgs#$p" -o "tool-$p" -L 2>&1 | tail -3
            nix path-info --inputs-from . -S -h "nixpkgs#$p"
            ls "tool-$p/bin"
          done
          echo "--- desync ---"
          ./tool-desync/bin/desync --help
          echo "--- desync make ---"
          ./tool-desync/bin/desync make --help
          echo "--- desync extract ---"
          ./tool-desync/bin/desync extract --help
          echo "--- desync info ---"
          ./tool-desync/bin/desync info --help
          echo "--- desync chunk-server ---"
          ./tool-desync/bin/desync chunk-server --help
      - name: Build two neighbouring versions
        run: nix build .#update .#broken-update -o ver -L --print-build-logs
      - name: What a version is
        run: |
          set +e
          ls -lL ver ver-1
          echo "--- a ---"; cat ver/SHA256SUMS
          echo "--- b ---"; cat ver-1/SHA256SUMS
          df -h /
      - name: Unpack the store and verity of each
        run: |
          set -e
          mkdir -p work
          pick() { ls "$1"/*."$2".zst | head -n1; }
          for pair in "ver a" "ver-1 b"; do
            set -- $pair
            zstd -d -q -o "work/$2" "$(pick "$1" store)"
            zstd -d -q -o "work/$2.verity" "$(pick "$1" verity)"
            cp "$1"/*.efi "work/$2.efi"
          done
          ls -l work
          df -h /
      - name: Does the layout line up at all
        run: |
          set +e
          python3 - <<'PY'
          import os
          a = "work/a"; b = "work/b"
          sa, sb = os.path.getsize(a), os.path.getsize(b)
          print(f"a {sa} bytes, b {sb} bytes, difference {sb - sa}")
          BUCKETS = 64
          n = min(sa, sb)
          for bs in (4096, 65536):
              same = 0; total = 0; first = None; last = None
              hist = [0] * BUCKETS
              with open(a, "rb") as fa, open(b, "rb") as fb:
                  off = 0
                  CH = 1 << 24
                  while off < n:
                      ca = fa.read(min(CH, n - off)); cb = fb.read(min(CH, n - off))
                      if not ca:
                          break
                      for i in range(0, len(ca), bs):
                          total += 1
                          if ca[i:i+bs] == cb[i:i+bs]:
                              same += 1
                          else:
                              o = off + i
                              if first is None: first = o
                              last = o
                              hist[min(BUCKETS - 1, o * BUCKETS // n)] += 1
                      off += len(ca)
              print(f"{bs} byte blocks: {same} of {total} equal in place ({100.0 * same / total:.2f} percent)")
              print(f"  first differing offset {first}, last {last}")
              print("  differing blocks per 1/64 of the image:")
              print("  " + " ".join(str(h) for h in hist))
          PY
      - name: Chunk both
        run: |
          set +e
          D=./tool-desync/bin/desync
          for v in a b; do
            echo "--- make $v ---"
            start=$(date +%s)
            $D make --store "work/s-$v" "work/$v.caibx" "work/$v"
            echo "make: $? in $(( $(date +%s) - start )) seconds"
            echo "store: $(du -sb "work/s-$v" | cut -f1) bytes in $(find "work/s-$v" -name '*.cacnk' | wc -l) chunks"
            echo "index: $(stat -c %s "work/$v.caibx") bytes"
            $D info --store "work/s-$v" "work/$v.caibx"
          done
          df -h /
      - name: The delta between them
        run: |
          set +e
          (cd work/s-a && find . -name '*.cacnk' | sort) > work/a.list
          (cd work/s-b && find . -name '*.cacnk' | sort) > work/b.list
          comm -13 work/a.list work/b.list > work/new.list
          comm -12 work/a.list work/b.list > work/shared.list
          echo "a has $(wc -l < work/a.list) chunks, b has $(wc -l < work/b.list)"
          echo "shared $(wc -l < work/shared.list), new in b $(wc -l < work/new.list)"
          mkdir -p work/delta
          tar -C work/s-b -cf - -T work/new.list | tar -C work/delta -xf -
          echo "delta store: $(du -sb work/delta | cut -f1) bytes"
          echo "whole b store: $(du -sb work/s-b | cut -f1) bytes"
          echo "b.store.zst on the wire today: $(stat -Lc %s ver-1/*.store.zst) bytes"
      - name: Put b together from a and the delta alone
        run: |
          set +e
          D=./tool-desync/bin/desync
          start=$(date +%s)
          $D extract --store work/delta --seed work/a.caibx work/b.caibx work/out
          echo "extract: $? in $(( $(date +%s) - start )) seconds"
          ls -l work/out work/b
          cmp work/out work/b && echo "SAME as b" || echo "DIFFERENT from b"
          rm -f work/out
          df -h /
      - name: The same question for verity and the uki
        run: |
          set +e
          D=./tool-desync/bin/desync
          for kind in verity efi; do
            echo "=== $kind ==="
            ls -l "work/a.$kind" "work/b.$kind"
            $D make --store "work/v-a" "work/a.$kind.caibx" "work/a.$kind"
            $D make --store "work/v-b" "work/b.$kind.caibx" "work/b.$kind"
            (cd work/v-a && find . -name '*.cacnk' | sort) > "work/a.$kind.list"
            (cd work/v-b && find . -name '*.cacnk' | sort) > "work/b.$kind.list"
            echo "a $(wc -l < "work/a.$kind.list") chunks, b $(wc -l < "work/b.$kind.list"), shared $(comm -12 "work/a.$kind.list" "work/b.$kind.list" | wc -l)"
            comm -13 "work/a.$kind.list" "work/b.$kind.list" > "work/n.list"
            mkdir -p work/d
            tar -C work/v-b -cf - -T work/n.list | tar -C work/d -xf -
            echo "delta store: $(du -sb work/d | cut -f1) bytes of $(du -sb work/v-b | cut -f1)"
            rm -rf work/v-a work/v-b work/d
          done
      - name: Can the drive make the verity tree itself
        run: |
          set +e
          nix build --inputs-from . nixpkgs#cryptsetup -o cs -L 2>&1 | tail -2
          V=./cs/bin/veritysetup
          echo "--- the first bytes of the published tree ---"
          xxd -l 96 work/b.verity
          echo "--- what veritysetup makes of it ---"
          $V dump work/b.verity
          echo "dump: $?"
          dump=$($V dump work/b.verity 2>/dev/null)
          val() { printf '%s\n' "$dump" | awk -F: -v k="$1" 'index($0, k) == 1 { sub(/^[^:]*:[ \t]*/, ""); print; exit }'; }
          db=$(val "Data block size")
          hb=$(val "Hash block size")
          salt=$(val "Salt")
          blocks=$(val "Data blocks")
          echo "data block $db, hash block $hb, blocks $blocks, salt $salt"
          echo "--- make one from b's store and compare ---"
          start=$(date +%s)
          if [ -n "$salt" ]; then
            $V format --data-block-size="$db" --hash-block-size="$hb" \
              --data-blocks="$blocks" --salt="$salt" work/b work/mine.verity
          else
            $V format work/b work/mine.verity
          fi
          echo "format: $? in $(( $(date +%s) - start )) seconds"
          ls -l work/mine.verity work/b.verity
          cmp work/mine.verity work/b.verity && echo "SAME tree" || echo "DIFFERENT tree"
      - name: What the image asked repart for
        run: |
          set +e
          nix eval --json '.#nixosConfigurations.rift.config.image.repart.finalPartitions' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), indent=2))' | head -120
