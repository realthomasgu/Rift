name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # lens's panel links the wayland client library and xkbcommon, the lock screen pam
      - run: sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev libpam0g-dev >/dev/null
      - run: cargo fmt --all --check
      # the horizon crates need the compositor's system libraries, the nix job builds those
      - run: cargo clippy --workspace --exclude horizon --exclude niri-config --exclude niri-ipc --all-targets -- -D warnings
      - run: cargo test --workspace --exclude horizon --exclude niri-config --exclude niri-ipc
      - run: cargo build --release -p rift-flash --bin rift-flash -p rift-flash-app --bin rift-flash-app
      - name: Take a picture of the rift-flash app
        # under a virtual X display. the runner has no stick, so the app lists none, and quits
        run: |
          sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 >/dev/null
          timeout 120 xvfb-run -a -s '-screen 0 1280x1024x24' target/release/rift-flash-app --screenshot flash-app-linux.png
          test -s flash-app-linux.png
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: rift-flash-linux-${{ github.sha }}
          path: |
            target/release/rift-flash
            target/release/rift-flash-app
          retention-days: 14
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: flash-app-linux-${{ github.sha }}
          path: flash-app-linux.png
          retention-days: 14

  flash-macos:
    # rift-flash on a mac: clippy and the tests, then the runner's own disks refused, and a drive
    # written onto a disk image hdiutil attaches as a disk, the way a stick is written, and into a file.
    # the app is built, takes a picture of itself, and its own code writes a drive through the prompt
    name: rift-flash on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p librift --features disk --all-targets -- -D warnings
      - run: cargo clippy -p rift-flash --all-targets -- -D warnings
      - run: cargo clippy -p rift-flash-app --all-targets -- -D warnings
      - run: cargo test -p librift --features disk
      - run: cargo test -p rift-flash
      - run: cargo test -p rift-flash-app
      - run: cargo build --release -p rift-flash --bin rift-flash --example test-drive
      - run: cargo build --release -p rift-flash-app --bin rift-flash-app --example elevated
      - name: Write a drive onto a disk image
        run: |
          flash=target/release/rift-flash
          sample=target/release/examples/test-drive
          "$sample" image sample.raw.zst
          refused() {
            what=$1 words=$2
            shift 2
            if out=$("$@" 2>&1); then
              echo "$out"
              echo "::error::rift-flash wrote onto $what"
              exit 1
            fi
            echo "$what: $out"
            if ! grep -qE -- "$words" <<<"$out"; then
              echo "::error::rift-flash did not refuse $what with: $words"
              exit 1
            fi
          }
          refused "a disk without root" "needs root" "$flash" write --serial disk0 sample.raw.zst /dev/disk0
          # each of the runner's disks is refused, the one macOS runs from among them
          running=0
          for disk in $(diskutil list | awk '/^\/dev\/disk/ { print $1 }'); do
            refused "the runner's disk $disk" "is the drive this system runs from\.|is not a whole disk\.|is neither removable nor on USB\.|is read only\.|Unmount or close it first\." \
              sudo "$flash" write --serial "${disk#/dev/}" sample.raw.zst "$disk"
            if grep -qF "is the drive this system runs from." <<<"$out"; then running=1; fi
          done
          if [ "$running" != 1 ]; then
            echo "::error::rift-flash did not find the disk macOS runs from"
            exit 1
          fi
          # a raw file of 24G attached as a disk, with nothing mounted from it
          mkfile -n 24g drive.img
          image=$(hdiutil attach -imagekey diskimage-class=CRawDiskImage -nomount drive.img | awk 'NR == 1 { print $1 }')
          "$flash" list | tee list.txt
          grep -qF "$image, Disk Image, 24.0 GiB." list.txt
          # the app with the disk image listed and selected, in a picture. macos has no timeout command
          perl -e 'alarm 120; exec @ARGV' target/release/rift-flash-app --screenshot flash-app-macos.png sample.raw.zst
          test -s flash-app-macos.png
          refused "a wrong name" "is not the name of $image\. Nothing was written\." \
            sudo "$flash" write --serial disk99 sample.raw.zst "$image"
          sudo "$flash" write --exchange 64M --serial "${image#/dev/}" sample.raw.zst "$image"
          # rift-flash ejects the disk it wrote, and the file behind it holds the drive
          if diskutil info "$image" >/dev/null 2>&1; then
            echo "::error::$image is still attached"
            exit 1
          fi
          "$sample" check drive.img
          image=$(hdiutil attach -imagekey diskimage-class=CRawDiskImage -nomount drive.img | awk 'NR == 1 { print $1 }')
          diskutil list "$image"
          hdiutil detach "$image"
          # a file for a virtual machine
          mkfile -n 24g file.img
          sudo "$flash" write sample.raw.zst file.img
          "$sample" check file.img
          refused "a file written once" "is not empty" sudo "$flash" write sample.raw.zst file.img
          rm drive.img file.img
      - name: Write a drive the way the app does
        # the app's own code starts rift-flash write through the administrator prompt. it runs as
        # root here, where the prompt asks nothing
        timeout-minutes: 10
        run: |
          mkfile -n 24g elevated.img
          image=$(hdiutil attach -imagekey diskimage-class=CRawDiskImage -nomount elevated.img | awk 'NR == 1 { print $1 }')
          sudo target/release/examples/elevated "$PWD/target/release/rift-flash" "$PWD/sample.raw.zst" "$image" "${image#/dev/}" | tee elevated.txt
          grep -qF "$image is a Rift drive now" elevated.txt
          target/release/examples/test-drive check elevated.img
          rm elevated.img
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: rift-flash-macos-${{ github.sha }}
          path: |
            target/release/rift-flash
            target/release/rift-flash-app
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: flash-app-macos-${{ github.sha }}
          path: flash-app-macos.png
          if-no-files-found: ignore
          retention-days: 14

  flash-windows:
    # rift-flash on windows: clippy and the tests, then the runner's own disks refused, and a drive
    # written onto a VHDX diskpart attaches as a disk, the way a stick is written. the app is built,
    # takes a picture of itself, and its own code writes a drive through Start-Process -Verb RunAs
    name: rift-flash on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p librift --features disk --all-targets -- -D warnings
      - run: cargo clippy -p rift-flash --all-targets -- -D warnings
      - run: cargo clippy -p rift-flash-app --all-targets -- -D warnings
      - run: cargo test -p librift --features disk
      - run: cargo test -p rift-flash
      - run: cargo test -p rift-flash-app
      - run: cargo build --release -p rift-flash --bin rift-flash --example test-drive
      - run: cargo build --release -p rift-flash-app --bin rift-flash-app --example elevated
      - name: Write a drive onto a virtual disk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flash = 'target\release\rift-flash.exe'
          $sample = 'target\release\examples\test-drive.exe'
          function Refused($what, $words, [string[]]$arguments) {
            $out = & $flash @arguments 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) {
              Write-Host $out
              throw "rift-flash wrote onto $what"
            }
            Write-Host "${what}: $out"
            if ($out -notmatch $words) {
              throw "rift-flash did not refuse $what with: $words"
            }
            return $out
          }
          & $sample image sample.raw.zst
          if ($LASTEXITCODE -ne 0) { throw 'test-drive did not write the sample image' }
          # each of the runner's disks is refused, the one Windows runs from among them
          $running = $false
          foreach ($disk in Get-Disk) {
            $name = "\\.\PhysicalDrive$($disk.Number)"
            $out = Refused $name 'is the drive this system runs from\.|is neither removable nor on USB\.' @('write', '--serial', "PhysicalDrive$($disk.Number)", 'sample.raw.zst', $name)
            if ($out -match 'runs from') { $running = $true }
          }
          if (-not $running) { throw 'rift-flash did not find the disk Windows runs from' }
          # a VHDX of 24G attached as a disk, with no partitions on it
          $vhd = Join-Path $env:RUNNER_TEMP 'drive.vhdx'
          "create vdisk file=`"$vhd`" maximum=24576 type=expandable`nselect vdisk file=`"$vhd`"`nattach vdisk" | Set-Content attach.txt
          diskpart /s attach.txt
          if ($LASTEXITCODE -ne 0) { throw 'diskpart did not attach the virtual disk' }
          Start-Sleep -Seconds 5
          $number = (Get-Disk | Where-Object { [string]$_.BusType -eq 'File Backed Virtual' }).Number
          $name = "\\.\PhysicalDrive$number"
          $list = & $flash list | Out-String
          Write-Output $list
          if (-not $list.Contains("$name, Msft Virtual Disk, 24.0 GiB.")) { throw "rift-flash list does not show $name" }
          # the app with the virtual disk listed and selected, in a picture. it has no console, so it is
          # waited for
          $app = Start-Process -FilePath 'target\release\rift-flash-app.exe' -ArgumentList '--screenshot', 'flash-app-windows.png', 'sample.raw.zst' -PassThru
          if (-not $app.WaitForExit(120000)) { $app.Kill(); throw 'the app did not quit after its picture' }
          if (-not (Test-Path 'flash-app-windows.png')) { throw "the app took no picture and ended with $($app.ExitCode)" }
          Refused 'a wrong name' 'is not the name of' @('write', '--serial', 'PhysicalDrive99', 'sample.raw.zst', $name)
          & $flash write --exchange 64M --serial "PhysicalDrive$number" sample.raw.zst $name
          if ($LASTEXITCODE -ne 0) { throw "rift-flash did not write $name" }
          & $sample check $name
          if ($LASTEXITCODE -ne 0) { throw "$name does not hold the drive" }
          Get-Partition -DiskNumber $number | Format-Table -AutoSize
          "select vdisk file=`"$vhd`"`ndetach vdisk" | Set-Content detach.txt
          diskpart /s detach.txt
      - name: Write a drive the way the app does
        # the app's own code starts rift-flash write through Start-Process -Verb RunAs. the runner's
        # account is an administrator that is not asked
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = Join-Path $env:RUNNER_TEMP 'elevated.vhdx'
          "create vdisk file=`"$vhd`" maximum=24576 type=expandable`nselect vdisk file=`"$vhd`"`nattach vdisk" | Set-Content attach.txt
          diskpart /s attach.txt
          if ($LASTEXITCODE -ne 0) { throw 'diskpart did not attach the virtual disk' }
          Start-Sleep -Seconds 5
          $number = (Get-Disk | Where-Object { [string]$_.BusType -eq 'File Backed Virtual' }).Number
          $name = "\\.\PhysicalDrive$number"
          $flash = (Resolve-Path 'target\release\rift-flash.exe').Path
          $image = (Resolve-Path 'sample.raw.zst').Path
          $out = & 'target\release\examples\elevated.exe' $flash $image $name "PhysicalDrive$number" | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "the write the app starts ended with $code" }
          if (-not $out.Contains("$name is a Rift drive now")) { throw 'rift-flash did not say the drive is written' }
          & 'target\release\examples\test-drive.exe' check $name
          if ($LASTEXITCODE -ne 0) { throw "$name does not hold the drive" }
          "select vdisk file=`"$vhd`"`ndetach vdisk" | Set-Content detach.txt
          diskpart /s detach.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: rift-flash-windows-${{ github.sha }}
          path: |
            target/release/rift-flash.exe
            target/release/rift-flash-app.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: flash-app-windows-${{ github.sha }}
          path: flash-app-windows.png
          if-no-files-found: ignore
          retention-days: 14

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix flake check -L

  design:
    name: Design lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/design-lint.sh
      - name: Check that the lint fails on a banned word
        run: |
          # the word is split so this file passes the lint itself
          printf 'A %s%s setup.\n' seam less > "$RUNNER_TEMP/banned.md"
          if bash tools/design-lint.sh "$RUNNER_TEMP/banned.md"; then
            echo "the lint accepted a banned word"; exit 1
          fi

  image:
    # github runners build the image until there is a real builder, and boot it in the same job. the
    # image with the update files of the two versions after it is past the 10G the actions cache keeps
    # for a repository, so nothing goes from one job to another. the image is an artifact on the run
    name: Image and boot test
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 150
    permissions:
      contents: read
      # the drop step below deletes the images older runs left behind
      actions: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Allow user namespaces
        # ubuntu blocks unprivileged userns via apparmor, systemd-repart needs them inside the sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        id: build
        # the image in result, in result-1 the update files of the same system a version on, and in
        # result-2 those of a version after it that never boots well. the boot test installs both
        run: nix build .#image .#update .#broken-update -L --print-build-logs --keep-failed || { echo "failed=1" >> "$GITHUB_OUTPUT"; exit 1; }
      - name: Report the size of the store partition
        # the store has to fit its 8G slot. repart makes the partition as big as what is in it, so
        # its size in the partition table is the number that counts
        run: |
          img=$(ls result/*.raw | head -n1)
          table=$(sfdisk -J "$img")
          # slot a's labels carry the version: store_0.1.0, store-verity_0.1.0
          size() {
            jq -r --arg prefix "$1" '.partitiontable as $t | $t.partitions[] | select(.name | startswith($prefix)) | .size * ($t.sectorsize // 512)' <<<"$table"
          }
          store=$(size store_)
          verity=$(size store-verity_)
          if [ -z "$store" ]; then
            echo "::error::The image has no store partition."
            sfdisk -l "$img"
            exit 1
          fi
          budget=$((8 * 1024 * 1024 * 1024))
          line="Store partition $(numfmt --to=iec-i --suffix=B "$store") ($store bytes) of 8.0GiB, verity $(numfmt --to=iec-i --suffix=B "${verity:-0}")"
          echo "$line"
          if [ "$store" -gt "$budget" ]; then
            echo "::error title=Store partition::$line. It is over its budget."
            exit 1
          fi
          echo "::notice title=Store partition::$line"
      - name: Diagnose
        if: failure() && steps.build.outputs.failed == '1'
        run: |
          drv=$(nix eval --raw .#nixosConfigurations.rift.config.system.build.intermediateImage.drvPath)
          echo "::group::nix log of $drv"
          nix log "$drv" | tail -n 80 || true
          echo "::endgroup::"
          echo "::group::kept build dirs"
          sudo find /nix/var/nix/builds /tmp -maxdepth 1 -type d -name 'nix-*' 2>/dev/null | while read -r d; do
            echo "== $d"; sudo ls -la "$d" | head -n 40
          done
          echo "::endgroup::"
      - name: Compress
        run: |
          sudo apt-get install -y zstd >/dev/null
          img=$(ls result/*.raw | head -n1)
          zstd -T0 -12 "$img" -o rift.raw.zst
          ls -la result/ rift.raw.zst
          # the update files are compressed already. one directory for each version, linked to the
          # files in the store rather than copied, which only root can do there
          mkdir updates
          sudo cp -rlL result-1 updates/next
          sudo cp -rlL result-2 updates/broken
          ls -la updates/*
          df -h /
      - name: Drop the images older runs left
        # each one is several G and the account has a storage quota. the upload below replaces them,
        # so only this run's image is kept. without this the upload fails with "storage quota has
        # been hit"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate \
            --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("rift-image-")) | "\(.created_at) \(.id)"' \
            | while read -r created id; do
            echo "dropping artifact $id from $created"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done
      - uses: actions/upload-artifact@v4
        # the image to download and flash. the boot test does not need it, so a full quota here
        # is not a failure
        continue-on-error: true
        with:
          name: rift-image-${{ github.sha }}
          path: rift.raw.zst
          retention-days: 14

      # the image runs from here on through the flake's vm app: rift-flash writes it onto a drive in a
      # file, qemu boots that with kvm, everything over serial
      - name: Build the vm app, rift-flash and the test's flatpak
        run: |
          nix build .#vm -o vm -L
          nix build .#rift-flash -o flash -L
          nix build .#test-flatpak -o test-flatpak -L
      - name: Install pexpect
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends python3-pexpect >/dev/null
      - name: Open kvm to the runner
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; else echo "no /dev/kvm, qemu will use tcg"; fi
      - name: Read the test models from the manifest
        # the chat model marked test, the embedding model the image runs for search by meaning, the
        # voice that says words out loud, which is two files, and the speech model that reads a
        # recording back. every file in models/cache goes into the models subvolume
        id: model
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          with open("models/manifest.toml", "rb") as f:
              manifest = tomllib.load(f)
          [chat] = [m for m in manifest["chat"] if m.get("test")]
          embedding = manifest["embedding"][0]
          voice = manifest["tts"][0]
          speech = manifest["speech"][0]
          files = [(m["sha256"], m["file"], m["url"]) for m in (chat, embedding, voice, speech)]
          files.append((voice["tokens_sha256"], voice["tokens"], voice["tokens_url"]))
          with open("models/test-models.txt", "w") as f:
              for sha256, name, url in files:
                  f.write(f"{sha256} {name} {url}\n")
          print("key=" + "-".join(sha256[:16] for sha256, _, _ in files))
          EOF
      - name: Cache the test models
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/cache
          key: models-${{ steps.model.outputs.key }}
      - name: Download the test models
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          while read -r sha256 file url; do
            curl -fL --retry 3 --create-dirs -o "models/cache/$file" "$url"
          done < models/test-models.txt
      - name: Check the test models
        run: |
          while read -r sha256 file url; do
            echo "$sha256  models/cache/$file"
          done < models/test-models.txt | sha256sum -c
      - name: Check what rift-flash refuses
        # it runs as root here, and every disk of the runner is inside it. a loop device, each of the
        # runner's disks, a file that holds something and a file that is too small are refused, and
        # nothing is written to any of them. the image is read and checked each time
        run: |
          refused() {
            what=$1 words=$2 target=$3
            if out=$(printf 'rift-test\n' | sudo flash/bin/rift-flash write rift.raw.zst "$target" 2>&1); then
              echo "$out"
              echo "::error::rift-flash wrote onto $what"
              exit 1
            fi
            echo "$what: $out"
            if ! grep -qE -- "$words" <<<"$out"; then
              echo "::error::rift-flash did not refuse $what with: $words"
              exit 1
            fi
          }
          flash/bin/rift-flash list
          truncate -s 32G loop.img
          loop=$(sudo losetup --find --show loop.img)
          refused "a loop device" "is not a whole disk\." "$loop"
          sudo losetup --detach "$loop"
          cmp -n 1048576 loop.img /dev/zero
          running=0
          for disk in $(lsblk --nodeps --noheadings --paths --output NAME,TYPE | awk '$2 == "disk" { print $1 }'); do
            before=$(sudo sfdisk --dump "$disk" 2>&1 || true)
            refused "the runner's disk $disk" "is the drive this system runs from\.|is neither removable nor on USB\." "$disk"
            if grep -qF "is the drive this system runs from." <<<"$out"; then running=1; fi
            if [ "$(sudo sfdisk --dump "$disk" 2>&1 || true)" != "$before" ]; then
              echo "::error::the partition table of $disk changed"
              exit 1
            fi
          done
          if [ "$running" != 1 ]; then
            echo "::error::rift-flash did not find the disk the runner runs from"
            exit 1
          fi
          printf 'something' > used.img
          truncate -s 32G used.img
          refused "a file that holds something" "is not empty, and rift-flash only writes into an empty file\." used.img
          truncate -s 8G small.img
          refused "a file that is too small" "holds 8\.0 GiB, and Rift needs 21\.1 GiB\." small.img
          rm loop.img used.img small.img
      - name: Boot
        run: |
          # the update files go on a drive of their own, persist has no room for them. the test
          # mounts each version's directory where systemd-sysupdate looks for updates
          truncate -s "$(($(du -sm updates | cut -f1) + 512))M" updates.img
          mkfs.ext4 -q -F -L updates -d updates updates.img
          sudo rm -r updates
          # an empty disk for the backup step. vault finds it by the uuid mkfs gives it
          truncate -s 256M backup.img
          mkfs.ext4 -q -F -L backup backup.img
          # a memory stick for Files: one exfat file system, the way a stick is sold, with nothing
          # on it. Files mounts it through udisks when its row in the sidebar is pressed
          truncate -s 256M stick.img
          nix shell --inputs-from . nixpkgs#exfatprogs -c mkfs.exfat -L STICK stick.img
          # an encrypted stick for Files: one luks2 volume with an ext4 inside it, the way a person
          # encrypts a stick with Disks. mkfs writes the file that is on it without mounting
          # anything, and the passphrase is the one the test types into Files' dialog
          truncate -s 128M locked.img
          printf 'rift-locked' > locked.txt
          mkdir -p private && printf 'the beach house\n' > private/holiday.txt
          # the package has several outputs, so the command itself is asked for by name: sudo needs
          # the whole path, since it does not take the PATH a nix shell sets
          cryptsetup=$(nix shell --inputs-from . nixpkgs#cryptsetup -c sh -c 'command -v cryptsetup')
          "$cryptsetup" luksFormat --type luks2 --label LOCKED --pbkdf pbkdf2 \
            --pbkdf-force-iterations 1000 --batch-mode locked.img locked.txt
          sudo "$cryptsetup" open --key-file locked.txt locked.img rift-locked-test
          sudo mkfs.ext4 -q -F -L PRIVATE -d private /dev/mapper/rift-locked-test
          sudo "$cryptsetup" close rift-locked-test
          rm -r private locked.txt
          # the disk the clone goes onto. sparse, the clone fills about 7G of it, and the runner has
          # more than 80G free. the first drive has an exchange partition, so the clone gets one too
          truncate -s 26G clone.img
          df -h .
          printf 'rift-test' > pass.txt
          # the vm app writes the image onto a drive in a file with rift-flash and boots that
          python3 tools/boot-test.py vm/bin/rift-vm rift.raw.zst pass.txt --models models/cache \
            --exchange 1G --log serial.log --splash splash.png --desktop desktop.png --lens \
            --updates updates.img --backup backup.img --clone clone.img --stick stick.img \
            --locked locked.img --flatpak test-flatpak --timeout 2400
      - name: Boot a drive that makes persist at its first boot
        # rift-flash leaves persist out, the way it writes a drive on macos and windows. the drive
        # asks for a passphrase over serial, makes persist and formats its exchange partition, and the
        # next boot opens that persist with the same passphrase. the vm has no network card, so
        # welcome opens on the page that says there is no network, at both logins
        run: |
          python3 tools/boot-test.py vm/bin/rift-vm rift.raw.zst pass.txt --first-boot --exchange 1G \
            --log first-boot.log --splash first-boot-splash.png --offline desktop-welcome-offline.png \
            --timeout 900
      - name: Boot with the graphical style
        # the kernel command line picks the other theme, through a SMBIOS string systemd-stub reads. the
        # splash check is the graphical one, and the drive powers off once the shell is up
        run: |
          python3 tools/boot-test.py vm/bin/rift-vm rift.raw.zst pass.txt --style graphical --splash-only \
            --log graphical.log --splash graphical-splash.png --timeout 600
      - name: Boot the style the Appearance page chose
        # the page writes the word onto the esp through Vault, the initrd reads it there, and the boot
        # after it draws that style. both ways, so three boots: text, then graphical, then text again
        run: |
          python3 tools/boot-test.py vm/bin/rift-vm rift.raw.zst pass.txt --boot-style \
            --log boot-style.log --splash boot-style-splash.png --timeout 1200
      - name: Boot with a software tpm
        # a key for persist sealed to the machine's tpm, so an owned machine opens the drive with
        # nothing typed. swtpm keeps each machine's tpm in a directory, and the same drive is booted
        # five times: before a key is sealed, after, on another machine's tpm, back on its own, and
        # after the key is wiped. The disks the boots above needed are gone by here, which leaves
        # room for the drive this one keeps between its boots
        run: |
          rm -f clone.img updates.img stick.img locked.img backup.img
          df -h .
          python3 tools/boot-test.py vm/bin/rift-vm rift.raw.zst pass.txt --tpm tpmstate \
            --log tpm.log --timeout 1800
          rm -rf tpmstate/drive.img
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: boot-serial-${{ github.sha }}
          path: |
            serial.log
            first-boot.log
            graphical.log
            boot-style.log
            tpm.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: boot-splash-${{ github.sha }}
          path: |
            splash.png
            first-boot-splash.png
            graphical-splash.png
            boot-style-splash.png
            boot-style-splash-graphical.png
            boot-style-splash-text.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        id: screendumps
        if: always()
        continue-on-error: true
        with:
          name: boot-desktop-${{ github.sha }}
          path: desktop*.png
          if-no-files-found: ignore
      - name: Put the screendumps in the log when the upload could not keep them
        # the account's artifact storage stays full for hours after it is cleared, and the run is
        # the only place these pictures exist. a few tens of kilobytes of base64 always fit in a
        # log, and `gh run view --log | base64 -d` gets the png back
        if: always() && steps.screendumps.outcome == 'failure'
        run: |
          for f in splash.png first-boot-splash.png graphical-splash.png boot-style-splash*.png desktop*.png; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            base64 -w0 "$f"; echo
            echo "::endgroup::"
          done
